<style>
:root{
  --bg:#f4f6fb;
  --bg2:#ffffff;
  --panel:#ffffff;
  --panel2:#f0f3fa;
  --line:rgba(15,33,72,.10);
  --line-strong:rgba(15,33,72,.18);
  --ink:#101a33;
  --ink-dim:#5b6a8c;
  --ink-faint:#8a97b5;
  --brand:#0a5fc7;
  --brand-light:#2f7ded;
  --brand-deep:#052a63;
  --done:#1fa34d;
  --done-bg:#e7f7ec;
  --done-line:#a9e2bc;
  --wip:#c98a10;
  --wip-bg:#fff4e0;
  --wip-line:#f0cf8c;
  --overdue:#e0453f;
  --overdue-bg:#fdeceb;
  --overdue-line:#f3b7b3;
  --pending:#8a97b5;
  --pending-bg:#eef1f7;
  --pending-line:#d3daea;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 10px 30px rgba(20,40,90,.12);
  color-scheme: light;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(10,95,199,.07), transparent 60%),
    radial-gradient(900px 600px at 110% 10%, rgba(10,95,199,.05), transparent 55%),
    #f4f6fb;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
#app{
  max-width:560px;
  margin:0 auto;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  position:relative;
}
@media (min-width:900px){
  #app{
    max-width:900px;
    box-shadow:0 0 60px rgba(20,40,90,.08);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }
  .content{padding:22px 32px 40px;}
}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:0;height:0;}
@media (min-width:700px){
  .content::-webkit-scrollbar{width:9px;}
  .content::-webkit-scrollbar-track{background:transparent;}
  .content::-webkit-scrollbar-thumb{background:rgba(15,33,72,.18);border-radius:20px;}
  .content::-webkit-scrollbar-thumb:hover{background:rgba(15,33,72,.32);}
  .content{scrollbar-width:thin;scrollbar-color:rgba(15,33,72,.22) transparent;}
}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;
  background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.9) 80%, rgba(255,255,255,.75));
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar img.logo{height:26px;display:block;border-radius:6px;box-shadow:0 2px 6px rgba(20,40,90,.18);}
.topbar .brandtext{display:flex;flex-direction:column;line-height:1.1;}
.topbar .brandtext b{font-size:15px;letter-spacing:.2px;}
.topbar .brandtext span{font-size:11px;color:var(--ink-dim);}
.topbar .spacer{flex:1;}
.iconbtn{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;
}
.iconbtn:active{transform:scale(.94);}

/* ---------- Content ---------- */
.content{flex:1;padding:14px 16px 100px;overflow-y:auto;}
.hidden{display:none !important;}

/* ---------- Rounded status dashboard ---------- */
.dash-row{display:flex;gap:10px;margin-bottom:16px;}
.dash-card{
  flex:1;border-radius:20px;padding:16px 10px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 6px 16px rgba(20,40,90,.08);border:1px solid var(--line);
}
.dash-card .dash-num{font-size:26px;font-weight:800;line-height:1;}
.dash-card .dash-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-top:2px;}

<body>
<div id="app"></div>
<script>
/* ============ SLB Security Action — App Logic ============ */
const STORE_KEY = 'slbSecurityAction_v1';
const LOGO = 'data:image/png;base64,LOGO_B64';

let DB = null;
let state = {
  tab: 'tasks',
  search: '',
  filter: 'all',
  calMonth: new Date().getMonth(),
  calYear: new Date().getFullYear(),
  calSel: null,
  reportMode: 'today',
  reportDate: todayStr(),
  reportStart: todayStr(),
  reportEnd: todayStr(),
  reportWeekId: null,
  editingTaskId: null,
  editingPersonId: null,
  unlocked: false,
  pinBuffer: '',
  pinMode: 'unlock' // unlock | setup | change-old | change-new | confirm-new
};

/* ---------------- Storage ---------------- */
function defaultDB(){
  return {
    people: [
      {id: uid(), name:'Unassigned', role:''}
    ],
    tasks: [],
    weeklyReports: [],
    nextSerial: 1,
    pin: null,
    settings: {
      notifDays: true,
      lastWeeklyCheck: null,
      createdAt: todayStr()
    }
  };
}
function loadDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) DB = JSON.parse(raw);
    else DB = defaultDB();
  }catch(e){ DB = defaultDB(); }
  if(!DB.people) DB.people = [{id:uid(),name:'Unassigned',role:''}];
  if(!DB.tasks) DB.tasks = [];
  if(!DB.weeklyReports) DB.weeklyReports = [];
  if(!DB.nextSerial) DB.nextSerial = (DB.tasks.length? Math.max(...DB.tasks.map(t=>t.serial||0))+1 : 1);
  if(!DB.settings) DB.settings = {notifDays:true,lastWeeklyCheck:null,createdAt:todayStr()};
}
function saveDB(){
  localStorage.setItem(STORE_KEY, JSON.stringify(DB));
}

/* ---------------- Utilities ---------------- */
function uid(){ return 'x'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function nowTimeStr(){ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function parseDT(dateStr, timeStr){
  if(!dateStr) return null;
  const [y,m,d] = dateStr.split('-').map(Number);
  let hh=23, mm=59;
  if(timeStr){ const p=timeStr.split(':'); hh=Number(p[0]); mm=Number(p[1]); }
  return new Date(y, m-1, d, hh, mm);
}
function fmtDate(dateStr){
  if(!dateStr) return '—';
  const [y,m,d]=dateStr.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d+' '+months[m-1]+' '+y;
}
function fmtDateShort(dateStr){
  if(!dateStr) return '—';
  const [y,m,d]=dateStr.split('-').map(Number);
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d+' '+months[m-1];
}
function fmtTime(t){ return t? t : '—'; }
function weekdayName(dateStr){
  const [y,m,d]=dateStr.split('-').map(Number);
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  return days[new Date(y,m-1,d).getDay()];
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function personName(id){
  const p = DB.people.find(p=>p.id===id);
  return p ? p.name : 'Unassigned';
}
function initials(name){
  return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
}
function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}

/* ---------------- Status logic ---------------- */
function isOverdue(task){
  if(task.status!=='notdone') return false;
  const dt = parseDT(task.plannedDate, task.plannedTime);
  if(!dt) return false;
  return dt.getTime() < Date.now();
}
function effectiveStatus(task){
  if(task.status==='done') return 'done';
  if(task.status==='wip') return 'wip';
  if(isOverdue(task)) return 'overdue';
  return 'pending';
}
function statusLabel(es){
  return {done:'Done', wip:'W.I.P.', overdue:'Overdue', pending:'Not Done'}[es];
}

/* ---------------- PIN hashing ---------------- */
async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ---------------- Weekly report auto-generation ---------------- */
function isoWeekNum(d){
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (dt.getUTCDay()+6)%7;
  dt.setUTCDate(dt.getUTCDate()-dayNum+3);
  const firstThursday = new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  const weekNum = 1 + Math.round(((dt-firstThursday)/86400000 - 3 + ((firstThursday.getUTCDay()+6)%7))/7);
  return weekNum;
}
function mondayOf(d){
  const dt = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = dt.getDay();
  const diff = (day===0?-6:1-day);
  dt.setDate(dt.getDate()+diff);
  return dt;
}
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function dstr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

function checkAndGenerateWeeklyReports(){
  const thisMonday = mondayOf(new Date());
  let cursorStart = addDays(thisMonday, -7); // most recent complete week start
  const existingStarts = new Set(DB.weeklyReports.map(r=>r.start));
  let earliestBound = DB.settings.createdAt || todayStr();
  let guard = 0;
  let generated = 0;
  while(guard < 60){
    guard++;
    const startStr = dstr(cursorStart);
    if(startStr < earliestBound) break;
    if(existingStarts.has(startStr)){
      break; // assume older weeks already backfilled
    }
    const endD = addDays(cursorStart,6);
    const endStr = dstr(endD);
    const tasksInWeek = DB.tasks.filter(t=> t.status==='done' && t.completedDate && t.completedDate>=startStr && t.completedDate<=endStr)
      .map(t=>({...t}));
    DB.weeklyReports.push({
      id: uid(),
      weekNum: isoWeekNum(cursorStart),
      start: startStr,
      end: endStr,
      generatedAt: new Date().toISOString(),
      tasks: tasksInWeek
    });
    generated++;
    cursorStart = addDays(cursorStart, -7);
  }
  DB.weeklyReports.sort((a,b)=> a.start<b.start?1:-1);
  if(generated>0){ DB.settings.lastWeeklyCheck = todayStr(); saveDB(); }
}

/* ---------------- Notifications ---------------- */
function ensureNotifPermission(){
  if(!('Notification' in window)) return;
  if(Notification.permission==='default'){
    Notification.requestPermission();
  }
}

/* Synthesized alert sound — no external audio file needed, works fully offline */
let _audioCtx = null;
function unlockAudio(){
  if(_audioCtx) return;
  try{ _audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}
window.addEventListener('click', unlockAudio, {once:true});
window.addEventListener('touchstart', unlockAudio, {once:true});
function playAlertSound(kind){
  try{
    if(!_audioCtx) _audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const ctx = _audioCtx;
    if(ctx.state==='suspended') ctx.resume();
    const now = ctx.currentTime;
    const notes = kind==='overdue' ? [880,660,880] : [700,900];
    let t = now;
    notes.forEach(freq=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.22, t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t+0.22);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t+0.24);
      t += 0.16;
    });
  }catch(e){}
}

function checkOverdueNotifications(){
  const todayKey = todayStr();
  const nowMs = Date.now();
  let playedDue=false, playedOverdue=false;
  DB.tasks.forEach(t=>{
    if(t.status!=='notdone') return;
    const dt = parseDT(t.plannedDate, t.plannedTime);
    if(!dt) return;
    const diffMs = dt.getTime() - nowMs;

    // "On top of the time" — task has just reached its planned time (within the last check window)
    if(diffMs<=0 && diffMs > -70000 && t.lastDueAlert !== t.plannedDate+'_'+t.plannedTime){
      t.lastDueAlert = t.plannedDate+'_'+t.plannedTime;
      playAlertSound('due');
      playedDue = true;
      if('Notification' in window && Notification.permission==='granted'){
        try{ new Notification('SLB Security Action — Task Due', {
          body: t.task + ' (assigned to ' + personName(t.personId) + ') is due now.',
          tag: 'due-'+t.id
        }); }catch(e){}
      }
    }

    // Overdue — repeats once per day until resolved
    if(isOverdue(t) && t.lastNotified !== todayKey){
      t.lastNotified = todayKey;
      playAlertSound('overdue');
      playedOverdue = true;
      if('Notification' in window && Notification.permission==='granted'){
        try{ new Notification('SLB Security Action — Overdue', {
          body: t.task + ' (assigned to ' + personName(t.personId) + ') was due ' + fmtDate(t.plannedDate) + ' ' + (t.plannedTime||''),
          tag: 'overdue-'+t.id
        }); }catch(e){}
      }
    }
  });
  saveDB();
}

/* ---------------- Calendar view ---------------- */
function viewCalendar(){
  const y = state.calYear, m = state.calMonth;
  const first = new Date(y,m,1);
  const startOffset = (first.getDay()+6)%7; // Monday-first
  const daysInMonth = new Date(y,m+1,0).getDate();
  const prevDays = new Date(y,m,0).getDate();
  const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];

  const tasksByDate = {};
  DB.tasks.forEach(t=>{
    const key = t.plannedDate;
    if(!key) return;
    (tasksByDate[key] = tasksByDate[key]||[]).push(t);
  });

  let cells = '';
  for(let i=0;i<startOffset;i++){
    const dnum = prevDays-startOffset+1+i;
    cells += `<div class="cal-day other">${dnum}</div>`;
  }
  const todayS = todayStr();
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = y+'-'+pad(m+1)+'-'+pad(d);
    const dayTasks = tasksByDate[dateStr]||[];
    const statuses = new Set(dayTasks.map(effectiveStatus));
    let dots='';
    ['overdue','wip','pending','done'].forEach(s=>{
      if(statuses.has(s)) dots += `<i style="background:var(--${s==='pending'?'pending':s})"></i>`;
    });
    const isToday = dateStr===todayS;
    const isSel = dateStr===state.calSel;
    cells += `<div class="cal-day ${isToday?'today':''} ${isSel?'sel':''}" data-date="${dateStr}">
      ${d}<div class="cal-dots">${dots}</div>
    </div>`;
  }
  const totalCells = startOffset+daysInMonth;
  const trailing = (7-(totalCells%7))%7;
  for(let i=1;i<=trailing;i++) cells += `<div class="cal-day other">${i}</div>`;

  let dayListHtml = '';
  if(state.calSel){
    const dayTasks = (tasksByDate[state.calSel]||[]).sort((a,b)=> (a.plannedTime||'').localeCompare(b.plannedTime||''));
    dayListHtml = `<div class="cal-daylist">
      <div class="section-title">${fmtDate(state.calSel)} — ${weekdayName(state.calSel)}</div>
      ${dayTasks.length? dayTasks.map(taskCardHtml).join('') : `<div class="empty-state"><p>No tasks planned this day.</p></div>`}
    </div>`;
  }

  return `
    <div class="cal-head">
      <b>${monthNames[m]} ${y}</b>
      <div class="cal-nav">
        <button class="iconbtn" id="calPrev">&#8249;</button>
        <button class="iconbtn" id="calToday">&#8226;</button>
        <button class="iconbtn" id="calNext">&#8250;</button>
      </div>
    </div>
    <div class="cal-grid">
      <div class="cal-dow">Mo</div><div class="cal-dow">Tu</div><div class="cal-dow">We</div>
      <div class="cal-dow">Th</div><div class="cal-dow">Fr</div><div class="cal-dow">Sa</div><div class="cal-dow">Su</div>
      ${cells}
    </div>
    ${dayListHtml}
  `;
}

/* ---------------- Export ---------------- */
function csvEscape(v){
  v = String(v==null?'':v);
  if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function exportCsv(list, label){
  const header = ['S/N','Task','Responsible Person','Planned Date','Planned Time','Completed Date','Completed Time','Status'];
  const rows = list.slice().sort((a,b)=> (a.completedDate||a.plannedDate).localeCompare(b.completedDate||b.plannedDate)).map(t=>[
    t.serial, t.task, personName(t.personId), fmtDateShort(t.plannedDate), t.plannedTime||'',
    t.completedDate?fmtDateShort(t.completedDate):'', t.completedTime||'', statusLabel(effectiveStatus(t))
  ]);
  const csv = [header, ...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(["\ufeff"+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'SLB_Security_Action_'+label+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

          </div>
          <div style="background:#eef1f7;border-radius:6px;height:8px;overflow:hidden;">
            <div style="width:${(count/maxP*100).toFixed(0)}%;background:linear-gradient(90deg,var(--brand-light),var(--brand));height:100%;"></div>
          </div>
        </div>
      `).join('') : `<div class="empty-state" style="padding:20px;"><p>No completed tasks yet.</p></div>`}
    </div>
  `;
}
function drawStatsCharts(){
  const pie = document.getElementById('pieChart');
  if(pie){
    const ctx = pie.getContext('2d');
    const done = DB.tasks.filter(t=>t.status==='done').length;
    const wip = DB.tasks.filter(t=>t.status==='wip').length;
    const overdue = DB.tasks.filter(t=>effectiveStatus(t)==='overdue').length;
    const pending = DB.tasks.filter(t=>effectiveStatus(t)==='pending').length;
    const total = done+wip+overdue+pending;
    const cx=pie.width/2, cy=pie.height/2, r=pie.width/2-6;
    ctx.clearRect(0,0,pie.width,pie.height);
    if(total===0){
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.strokeStyle='#e4e9f4'; ctx.lineWidth=18; ctx.stroke();
    } else {
      const segs = [['#1fa34d',done],['#d69a1a',wip],['#e0453f',overdue],['#65759f',pending]];
      let start=-Math.PI/2;
      segs.forEach(([color,val])=>{
        if(val<=0) return;
        const angle = (val/total)*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,r,start,start+angle);
        ctx.closePath();
        ctx.fillStyle=color;
        ctx.fill();
        start += angle;
      });
      ctx.beginPath(); ctx.arc(cx,cy,r*0.58,0,Math.PI*2); ctx.fillStyle='#ffffff'; ctx.fill();
    }
  }
  const bar = document.getElementById('barChart');
  if(bar){
    const ctx = bar.getContext('2d');
    const w = bar.width, h = bar.height;
    ctx.clearRect(0,0,w,h);
    let cursor = mondayOf(new Date());
    const buckets = [];
    for(let i=7;i>=0;i--){
      const start = addDays(cursor, -7*i);
      const end = addDays(start,6);
      const startS=dstr(start), endS=dstr(end);
      const c = DB.tasks.filter(t=> t.status==='done' && t.completedDate>=startS && t.completedDate<=endS).length;
      buckets.push({label:'W'+isoWeekNum(start), count:c});
    }
    const maxV = Math.max(1,...buckets.map(b=>b.count));
    const padL=6, padB=20, padT=10;
    const bw = (w-padL*2)/buckets.length;
    buckets.forEach((b,i)=>{
      const bh = (b.count/maxV)*(h-padB-padT);
      const x = padL + i*bw + bw*0.2;
      const y = h-padB-bh;
      ctx.fillStyle = '#3d8bff';
      ctx.fillRect(x,y,bw*0.6,bh);
      ctx.fillStyle='#8a97b5';
      ctx.font='9px sans-serif';
      ctx.textAlign='center';
      ctx.fillText(b.label, x+bw*0.3, h-6);
      if(b.count>0){ ctx.fillStyle='#101a33'; ctx.fillText(b.count, x+bw*0.3, y-4); }
    });
  }
}

/* ---------------- Task modal ---------------- */
function openTaskModal(id){
  state.editingTaskId = id || null;
  const t = id ? DB.tasks.find(x=>x.id===id) : null;
  const peopleOpts = DB.people.map(p=>`<option value="${p.id}" ${t&&t.personId===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('');
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2>${t? 'Edit Task':'New Security Action'}<small>${t? 'Serial #'+t.serial : 'Log a task or inspection to track'}</small></h2>
      <div class="field"><label>Task to be done</label>
        <textarea id="fTask" placeholder="e.g. Inspect Main Gate CCTV coverage">${escapeHtml(t? t.task:'')}</textarea></div>
      <div class="field"><label>Responsible person</label>
        <select id="fPerson">${peopleOpts}</select></div>
      <div class="field-row">
        <div class="field"><label>Planned date</label><input type="date" id="fDate" value="${t? t.plannedDate: todayStr()}"></div>
        <div class="field"><label>Planned time</label><input type="time" id="fTime" value="${t? t.plannedTime||'': nowTimeStr()}"></div>
      </div>
      <div class="field"><label>Status</label>
        <div class="pill-row" id="fStatusRow">
          <button type="button" class="pill-opt ${(!t||t.status==='notdone')?'sel':''}" data-st="notdone">Not Done</button>
          <button type="button" class="pill-opt ${t&&t.status==='wip'?'sel':''}" data-st="wip">W.I.P.</button>
          <button type="button" class="pill-opt ${t&&t.status==='done'?'sel':''}" data-st="done">Done</button>
        </div>
      </div>
      <div class="btnrow">
        <button class="btn ghost" id="cancelTask">Cancel</button>
        <button class="btn primary" id="saveTask">${t?'Save changes':'Add task'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  let chosenStatus = t? t.status : 'notdone';
  overlay.querySelectorAll('#fStatusRow .pill-opt').forEach(btn=>{
    btn.onclick = ()=>{
      overlay.querySelectorAll('#fStatusRow .pill-opt').forEach(b=>b.classList.remove('sel'));
      btn.classList.add('sel'); chosenStatus = btn.dataset.st;
    };
  });
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#cancelTask').onclick = ()=> overlay.remove();
  overlay.querySelector('#saveTask').onclick = ()=>{
    const taskText = overlay.querySelector('#fTask').value.trim();
    if(!taskText){ toast('Please describe the task.'); return; }
    const personId = overlay.querySelector('#fPerson').value;
    const plannedDate = overlay.querySelector('#fDate').value || todayStr();
    const plannedTime = overlay.querySelector('#fTime').value;
    if(t){
      const wasDone = t.status==='done';
      t.task = taskText; t.personId = personId; t.plannedDate = plannedDate; t.plannedTime = plannedTime;
      if(chosenStatus==='done' && !wasDone){ t.completedDate = todayStr(); t.completedTime = nowTimeStr(); }
      if(chosenStatus!=='done'){ t.completedDate=null; t.completedTime=null; }
      t.status = chosenStatus;
    } else {
      DB.tasks.push({
        id: uid(), serial: DB.nextSerial++, task: taskText, personId, plannedDate, plannedTime,
        status: chosenStatus,
        completedDate: chosenStatus==='done'? todayStr(): null,
        completedTime: chosenStatus==='done'? nowTimeStr(): null,
        createdAt: new Date().toISOString(), lastNotified: null
      });
    }
    saveDB(); overlay.remove(); renderTab(); toast(t? 'Task updated':'Task added');
  };
}

function handleStatusChange(id, newStatus){
  const t = DB.tasks.find(x=>x.id===id);
  if(!t) return;
  const wasDone = t.status==='done';
  t.status = newStatus;
  if(newStatus==='done' && !wasDone){
    t.completedDate = todayStr(); t.completedTime = nowTimeStr();
  } else if(newStatus!=='done'){
    t.completedDate = null; t.completedTime = null;
  }
  saveDB(); renderTab();
}
function deleteTask(id){
  if(!confirm('Delete this task permanently?')) return;
  DB.tasks = DB.tasks.filter(t=>t.id!==id);
  saveDB(); renderTab(); toast('Task deleted');
}

/* ---------------- PIN lock screen ---------------- */
function lockApp(){
  state.unlocked = false;
  state.pinBuffer='';
  state.pinMode='unlock';
  showLock();
}
function showLock(msg){
  let overlay = document.getElementById('lockOverlay');
  if(overlay) overlay.remove();
  overlay = document.createElement('div');
  overlay.id='lockOverlay';
  overlay.className='lockscreen';
  const title = {
    unlock:'Enter PIN to unlock', setup:'Set a new PIN',
    'change-old':'Enter current PIN', 'change-new':'Enter new PIN', 'confirm-new':'Confirm new PIN'
  }[state.pinMode];
  overlay.innerHTML = `
    <img src="${LOGO}" alt="SLB">
    <h2>${title}</h2>
    <div class="pindots" id="pindots"></div>
    <div class="pinpad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-num="${n}">${n}</button>`).join('')}
      <button data-num="clear" style="font-size:12px;">Clear</button>
      <button data-num="0">0</button>
      <button data-num="back">&#9003;</button>
    </div>
    <div class="pinerr" id="pinerr">${msg||''}</div>
    ${state.pinMode==='unlock' && !DB.pin ? '' : ''}
  `;
  document.body.appendChild(overlay);
  renderPinDots();
  overlay.querySelectorAll('.pinpad button').forEach(btn=>{
    btn.onclick = ()=> pinKeyPress(btn.dataset.num);
  });
}
function renderPinDots(){
  const dots = document.getElementById('pindots');
  if(!dots) return;
  dots.innerHTML = [0,1,2,3].map(i=> `<i class="${i<state.pinBuffer.length?'filled':''}"></i>`).join('');
}
async function pinKeyPress(key){
  const err = document.getElementById('pinerr');
  if(key==='clear'){ state.pinBuffer=''; renderPinDots(); return; }
  if(key==='back'){ state.pinBuffer = state.pinBuffer.slice(0,-1); renderPinDots(); return; }
  if(state.pinBuffer.length>=6) return;
  state.pinBuffer += key;
  renderPinDots();
  if(state.pinBuffer.length<4) return;
  // auto-submit at 4 digits
  setTimeout(async ()=>{
    if(state.pinMode==='unlock'){
      const hash = await sha256(state.pinBuffer);
      if(hash===DB.pin){
        document.getElementById('lockOverlay').remove();
        state.unlocked=true;
        init2();
      } else {
        if(err) err.textContent='Incorrect PIN. Try again.';
        state.pinBuffer=''; renderPinDots();
      }
    } else if(state.pinMode==='setup' || state.pinMode==='change-new'){
      state._newPin = state.pinBuffer;
      state.pinBuffer='';
      state.pinMode='confirm-new';
      showLock();
    } else if(state.pinMode==='confirm-new'){
      if(state.pinBuffer===state._newPin){
        DB.pin = await sha256(state.pinBuffer);
        saveDB();
        document.getElementById('lockOverlay').remove();
        toast('PIN saved');
        state.unlocked=true;
        render();
      } else {
        if(err) err.textContent='PINs did not match. Try again.';
        state.pinBuffer=''; state._newPin=null; state.pinMode='setup'; showLock();
      }
    } else if(state.pinMode==='change-old'){
      const hash = await sha256(state.pinBuffer);
      if(hash===DB.pin){
        state.pinBuffer=''; state.pinMode='change-new'; showLock();
      } else {
        if(err) err.textContent='Incorrect current PIN.';
        state.pinBuffer=''; renderPinDots();
      }
    }
  }, 120);
}
function startPinSetup(){ state.pinMode='setup'; state.pinBuffer=''; showLock(); }
function startPinChange(){
  if(!confirm('Change PIN? Choose OK to set a new PIN, or Cancel then use Remove instead.')) return;
  state.pinMode='change-old'; state.pinBuffer=''; showLock();
}

/* ---------------- Backup / Restore / Erase ---------------- */
function backupData(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'SLB_Security_Action_Backup_'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  toast('Backup downloaded');
}
function restoreData(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data.tasks || !data.people) throw new Error('bad file');
      DB = data;
      saveDB();
      toast('Data restored');
      renderTab();
    }catch(err){ toast('Invalid backup file'); }
  };
  reader.readAsText(file);
}
function eraseAll(){
  if(!confirm('This will permanently erase ALL tasks, people and reports. Continue?')) return;
  if(!confirm('Are you absolutely sure? This cannot be undone.')) return;
  DB = defaultDB();
  saveDB();
  renderTab();
  toast('All data erased');
}

/* ---------------- Event wiring per tab ---------------- */
function wireTabEvents(){
  if(state.tab==='tasks'){
    const s = document.getElementById('searchInput');
    if(s){
      s.oninput = ()=>{ state.search = s.value; renderTaskListOnly(); };
      // keep focus after re-render
    }
    document.querySelectorAll('.chip[data-filter]').forEach(c=>{
      c.onclick = ()=>{ state.filter = c.dataset.filter; renderTab(); };
    });
    wireTaskCards();
  }
  if(state.tab==='calendar'){
    document.getElementById('calPrev').onclick = ()=>{
      state.calMonth--; if(state.calMonth<0){state.calMonth=11; state.calYear--;} renderTab();
    };
    document.getElementById('calNext').onclick = ()=>{
      state.calMonth++; if(state.calMonth>11){state.calMonth=0; state.calYear++;} renderTab();
    };
    document.getElementById('calToday').onclick = ()=>{
      const n=new Date(); state.calMonth=n.getMonth(); state.calYear=n.getFullYear(); state.calSel=todayStr(); renderTab();
    };
    document.querySelectorAll('.cal-day[data-date]').forEach(d=>{
      d.onclick = ()=>{ state.calSel = (state.calSel===d.dataset.date)? null : d.dataset.date; renderTab(); };
    });
    wireTaskCards();
  }
  if(state.tab==='reports'){
    document.querySelectorAll('.report-tabs [data-rmode]').forEach(b=>{
      b.onclick = ()=>{ state.reportMode=b.dataset.rmode; state.reportWeekId=null; renderTab(); };
    });
    const rd = document.getElementById('repDate');
    if(rd) rd.onchange = ()=>{ state.reportDate = rd.value; renderTab(); };
    const rs = document.getElementById('repStart');
    if(rs) rs.onchange = ()=>{ state.reportStart = rs.value; renderTab(); };
    const re = document.getElementById('repEnd');
    if(re) re.onchange = ()=>{ state.reportEnd = re.value; renderTab(); };
    document.querySelectorAll('.weekhist-item').forEach(w=>{
      w.onclick = ()=>{ state.reportWeekId = w.dataset.week; renderTab(); };
    });
    const back = document.getElementById('backToWeeks');
    if(back) back.onclick = ()=>{ state.reportWeekId=null; renderTab(); };
    const csvBtn = document.getElementById('expCsv');
    if(csvBtn) csvBtn.onclick = ()=> exportCsv(currentReportList(), currentReportLabel());
    const pdfBtn = document.getElementById('expPdf');
    if(pdfBtn) pdfBtn.onclick = ()=> exportPdf(currentReportList(), currentReportTitle(), currentReportSubtitle());
  }
  if(state.tab==='stats'){
    drawStatsCharts();
  }
  if(state.tab==='people'){
    document.getElementById('addPersonBtn').onclick = ()=> openPersonModal();
    document.querySelectorAll('.person-card').forEach(c=>{
      c.onclick = ()=> openPersonModal(c.dataset.person);
    });
  }
  if(state.tab==='settings'){
    document.getElementById('pinToggleBtn').onclick = ()=>{
      if(DB.pin){
        const action = prompt('Type CHANGE to set a new PIN, or REMOVE to disable PIN lock.');
        if(action && action.trim().toUpperCase()==='REMOVE'){ DB.pin=null; saveDB(); toast('PIN removed'); renderTab(); }
        else if(action && action.trim().toUpperCase()==='CHANGE'){ startPinChange(); }
      } else { startPinSetup(); }
    };
    document.getElementById('notifBtn').onclick = ()=>{
      if(!('Notification' in window)){ toast('Notifications not supported on this browser'); return; }
      Notification.requestPermission().then(()=>{ renderTab(); });
    };
    document.getElementById('backupBtn').onclick = backupData;
    document.getElementById('restoreBtn').onclick = ()=> document.getElementById('restoreFile').click();
    document.getElementById('restoreFile').onchange = e=>{
      if(e.target.files[0]) restoreData(e.target.files[0]);
    };
    document.getElementById('eraseBtn').onclick = eraseAll;
  }
}
function renderTaskListOnly(){
  const list = filteredTasks();
  const el = document.getElementById('taskList');
  if(!el) return;
  el.innerHTML = list.length ? list.map(taskCardHtml).join('') : `
    <div class="empty-state"><div class="big">&#128737;</div><p>No tasks match your view.<br>Tap + to log a new security action.</p></div>`;
  wireTaskCards();
}
function wireTaskCards(){
  document.querySelectorAll('.status-select[data-id]').forEach(sel=>{
    sel.onchange = ()=> handleStatusChange(sel.dataset.id, sel.value);
  });
  document.querySelectorAll('[data-edit]').forEach(b=>{
    b.onclick = ()=> openTaskModal(b.dataset.edit);
  });
  document.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = ()=> deleteTask(b.dataset.del);
  });
}

  render();
  ensureNotifPermission();
  checkAndGenerateWeeklyReports();
  checkOverdueNotifications();
  setInterval(()=>{ checkAndGenerateWeeklyReports(); checkOverdueNotifications(); if(state.tab==='tasks'||state.tab==='calendar') renderTab(); }, 60000);
